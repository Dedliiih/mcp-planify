[package]
name = "mcp-planify"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
dirs = "6.0.0"
rusqlite = "0.39.0"
thiserror = "2.0.18"
uuid = { version = "1", features = ["v4"] } 
rmcp = { version = "1.7", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"